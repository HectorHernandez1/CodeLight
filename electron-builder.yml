appId: com.codelight.app
productName: CodeLight
copyright: Copyright © 2026 Hector

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
  icon: assets/icon.png
  darkModeSupport: true

dmg:
  title: CodeLight
  icon: assets/icon.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

files:
  - src/**/*
  - assets/**/*
  - node_modules/**/*
  - "!node_modules/*/{CHANGELOG.md,README.md,readme.md,test,__tests__,tests,*.ts}"
  - "!**/CLAUDE.md"
  # Monaco ships four builds; the app only loads min/ (see MONACO_PATH)
  - "!node_modules/monaco-editor/{esm,dev,min-maps}/**"
  # macOS-only app: strip other platforms' node-pty binaries
  - "!node_modules/node-pty/prebuilds/{win32-x64,win32-arm64,linux-x64,linux-arm64}/**"
  # Source maps are dev-only
  - "!**/*.js.map"
  - "!**/*.mjs.map"

directories:
  output: dist
  buildResources: assets

asar: true
compression: maximum

publish:
  provider: github
  owner: HectorHernandez1
  repo: CodeLight
