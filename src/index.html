<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:;">
  <title>CodeLight</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Title bar for window dragging -->
  <div id="title-bar"></div>

  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span class="sidebar-tab active" data-view="explorer">EXPLORER</span>
        <span class="sidebar-tab" data-view="search">SEARCH</span>
      </div>
      <div id="file-tree"></div>
      <div id="search-view" class="hidden">
        <div id="search-input-row">
          <input type="text" id="search-input" placeholder="Search" spellcheck="false">
          <button id="search-case-toggle" title="Match case">Aa</button>
        </div>
        <div id="search-summary"></div>
        <div id="search-results"></div>
      </div>
    </div>

    <!-- Resize handle for sidebar -->
    <div id="sidebar-resize-handle"></div>

    <!-- Main content area -->
    <div id="main-content">
      <!-- Tab bar -->
      <div id="tab-bar">
        <div id="tabs"></div>
      </div>

      <!-- Editor container -->
      <div id="editor-wrapper">
        <div id="editor-container" class="editor-pane"></div>
        <div id="split-resize-handle" class="hidden"></div>
        <div id="editor-container-split" class="editor-pane hidden"></div>
      </div>

      <!-- Integrated terminal panel -->
      <div id="terminal-resize-handle" class="hidden"></div>
      <div id="terminal-panel" class="hidden">
        <div id="terminal-header">
          <div class="terminal-tabs">
            <span class="terminal-tab active">TERMINAL</span>
          </div>
          <div class="terminal-actions">
            <span id="terminal-shell-label"></span>
            <button id="terminal-kill" title="Kill terminal">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 5h10M6.5 5V3.5h3V5M5 5l.7 8.5h4.6L11 5M6.8 7.5v3.5M9.2 7.5v3.5"/></svg>
            </button>
            <button id="terminal-maximize" title="Maximize panel size">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10l5-5 5 5"/></svg>
            </button>
            <button id="terminal-close" title="Hide panel (process keeps running)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
          </div>
        </div>
        <div id="terminal-container"></div>
      </div>

      <!-- Status bar -->
      <div id="status-bar">
        <div id="status-left">
          <span id="status-folder" title="Click to copy path"></span>
          <span id="status-position">Ln 1, Col 1</span>
        </div>
        <div id="status-right">
          <span id="status-language">Plain Text</span>
          <span id="status-encoding">UTF-8</span>
          <span id="status-eol">LF</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick open modal -->
  <div id="quick-open-modal" class="modal hidden">
    <div class="modal-content">
      <input type="text" id="quick-open-input" placeholder="Search files by name...">
      <div id="quick-open-results"></div>
    </div>
  </div>

  <!-- Go to line modal -->
  <div id="goto-line-modal" class="modal hidden">
    <div class="modal-content small">
      <input type="text" id="goto-line-input" placeholder="Go to line...">
    </div>
  </div>

  <script src="renderer.js" type="module"></script>
</body>

</html>
